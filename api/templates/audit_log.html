{% extends "base.html" %}
{% block title %}Audit Log — LoanCentral{% endblock %}
{% block content %}
<style>
  .audit-details { font-size:12px; color:var(--text2); line-height:1.45; max-width:340px; overflow-wrap:anywhere; }
  .audit-details .audit-key { color:var(--muted); }
</style>

<div class="section-header" style="margin-bottom:16px">
  <div><h2 class="section-title">Audit Log</h2></div>
  <div style="display:flex;flex-wrap:wrap;gap:8px;align-items:center">
    <input id="timelineUser" placeholder="username" style="background:var(--surface);border:1px solid var(--border);color:var(--text);padding:6px 10px;border-radius:6px;font-size:13px;outline:none;min-width:120px;flex:1 1 120px" />
    <button class="btn-secondary" onclick="viewUserTimeline()" style="white-space:nowrap;flex-shrink:0">User Timeline</button>
  </div>
</div>

<div class="card" style="margin-bottom:16px">
  <div style="display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end">
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:12px;color:var(--muted)">Actor</label>
      <input id="f-username" class="search-input" placeholder="any" style="width:140px">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:12px;color:var(--muted)">Target user</label>
      <input id="f-target-user" class="search-input" placeholder="any" style="width:140px">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:12px;color:var(--muted)">Loan ID</label>
      <input id="f-loan" class="search-input" placeholder="any" style="width:120px">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:12px;color:var(--muted)">Action</label>
      <select id="f-action" class="search-input" style="width:180px">
        <option value="">All actions</option>
        <option>loan_created</option><option>loan_repaid</option>
        <option>loan_unpaid</option><option>loan_refunded</option>
        <option>loan_forgiven</option><option>loan_updated</option>
        <option>dispute_opened</option><option>dispute_resolved</option>
        <option>role_granted</option><option>role_removed</option>
        <option>verified_lender_granted</option><option>verified_lender_revoked</option>
        <option>ban_user</option><option>unban_user</option>
        <option>loan_event_added</option>
      </select>
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:12px;color:var(--muted)">From</label>
      <input id="f-from" type="date" class="search-input" style="width:140px">
    </div>
    <div style="display:flex;flex-direction:column;gap:4px">
      <label style="font-size:12px;color:var(--muted)">To</label>
      <input id="f-to" type="date" class="search-input" style="width:140px">
    </div>
    <button class="btn-primary" onclick="loadAudit(0)">Search</button>
    <button class="btn-secondary" onclick="clearFilters()">Clear</button>
  </div>
</div>

<div id="audit-table-wrap">
  <div class="table-placeholder"><div class="spinner"></div></div>
</div>
<div id="audit-pagination" style="display:flex;gap:8px;margin-top:12px;align-items:center"></div>

<script>
let _auditOffset = 0;
const PAGE = 50;

function clearFilters() {
  document.getElementById('f-username').value    = '';
  document.getElementById('f-target-user').value = '';
  document.getElementById('f-loan').value        = '';
  document.getElementById('f-action').value      = '';
  document.getElementById('f-from').value        = '';
  document.getElementById('f-to').value          = '';
  loadAudit(0);
}

// Pre-fill filters from URL params (e.g. links from lender profile)
(function initFromUrl() {
  const sp = new URLSearchParams(location.search);
  if (sp.get('username'))        document.getElementById('f-username').value    = sp.get('username');
  if (sp.get('target_username')) document.getElementById('f-target-user').value = sp.get('target_username');
  if (sp.get('loan_id'))         document.getElementById('f-loan').value        = sp.get('loan_id');
})();

async function loadAudit(offset) {
  _auditOffset = offset;
  const params = new URLSearchParams({limit: PAGE, offset});
  const u = document.getElementById('f-username').value.trim();
  const tu = document.getElementById('f-target-user').value.trim();
  const lid = document.getElementById('f-loan').value.trim();
  const a = document.getElementById('f-action').value;
  const from = document.getElementById('f-from').value;
  const to   = document.getElementById('f-to').value;
  if (u) params.set('username', u);
  if (tu) params.set('target_username', tu);
  if (lid) params.set('loan_id', lid);
  if (a) params.set('action_type', a);
  if (from) params.set('date_from', from);
  if (to)   params.set('date_to', to + 'T23:59:59');
  const res  = await fetch('/api/admin/audit-log?' + params);
  const data = await res.json();
  renderAudit(data);
}

function actionBadge(action) {
  const colors = {
    loan_created:'var(--green)', loan_repaid:'var(--green)',
    loan_unpaid:'var(--red)', loan_refunded:'var(--muted)',
    dispute_opened:'var(--orange)', dispute_resolved:'var(--green)',
    verified_lender_granted:'var(--accent)', verified_lender_revoked:'var(--orange)',
    ban_user:'var(--red)', role_granted:'var(--accent)',
  };
  const c = colors[action] || 'var(--muted)';
  return `<span style="background:${c}22;color:${c};padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600">${action.replace(/_/g,' ')}</span>`;
}

// Details arrive as a JSON string (sometimes twice-encoded). Show them as short
// "key: value" lines that wrap, escaped: values like notes are user-typed.
function auditDetails(raw) {
  let val = raw;
  for (let i = 0; i < 2 && typeof val === 'string'; i++) {
    try { val = JSON.parse(val); } catch (e) { break; }
  }
  if (val === null || val === undefined || val === '') return '';
  if (typeof val !== 'object') {
    return `<div class="audit-details">${escapeHtml(String(val))}</div>`;
  }
  const lines = Object.entries(val)
    .filter(([, v]) => v !== null && v !== undefined && v !== '')
    .map(([k, v]) => `<div><span class="audit-key">${escapeHtml(k.replace(/_/g, ' '))}:</span> ${escapeHtml(typeof v === 'object' ? JSON.stringify(v) : String(v))}</div>`);
  return lines.length ? `<div class="audit-details">${lines.join('')}</div>` : '';
}

function renderAudit(data) {
  const rows = data.rows || [];
  const total = data.total || 0;
  const wrap = document.getElementById('audit-table-wrap');
  if (!rows.length) {
    wrap.innerHTML = `<div class="empty-state"><h3>No audit entries found</h3><p style="margin-top:6px;font-size:13px">Try adjusting the filters above, or actions will appear here once bot or dashboard activity occurs.</p></div>`;
    document.getElementById('audit-pagination').innerHTML = '';
    return;
  }
  let html = `<table class="data-table"><thead><tr>
    <th>Time</th><th>Actor</th><th>Role</th><th>Action</th>
    <th>Target</th><th>Details</th>
  </tr></thead><tbody>`;
  for (const r of rows) {
    const ts = r.created_at ? new Date(r.created_at).toLocaleString() : '—';
    let target = '<span style="color:var(--muted)">—</span>';
    if (r.target_id) {
      if (r.target_type === 'user')
        target = `<a href="/dashboard/users/${encodeURIComponent(r.target_id)}" style="color:var(--accent-h);font-size:12px">u/${escapeHtml(r.target_id)}</a>`;
      else if (r.target_type === 'loan')
        target = `<a href="/dashboard/admin/search?q=${encodeURIComponent(r.target_id)}" style="color:var(--accent-h);font-size:12px;font-family:monospace">loan ${escapeHtml(r.target_id)}</a>`;
      else if (r.target_type === 'verification_application')
        target = `<span style="color:var(--muted);font-size:12px">verification #${escapeHtml(r.target_id)}</span>`;
      else
        target = `<span style="color:var(--muted);font-size:12px">${escapeHtml(r.target_type || '')} #${escapeHtml(r.target_id)}</span>`;
    }
    const newVal = auditDetails(r.new_value_json);
    html += `<tr>
      <td style="white-space:nowrap;font-size:12px">${ts}</td>
      <td><a href="/dashboard/users/${encodeURIComponent(r.actor_username || '')}" style="color:var(--accent-h)">u/${escapeHtml(r.actor_username)}</a></td>
      <td><span class="badge badge-${escapeHtml(r.actor_role)}">${escapeHtml(r.actor_role)}</span></td>
      <td>${actionBadge(r.action_type)}</td>
      <td>${target}</td>
      <td>${newVal}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;

  // Pagination
  const pages = Math.ceil(total / PAGE);
  const cur   = Math.floor(_auditOffset / PAGE);
  let phtml = `<span style="color:var(--muted);font-size:13px">${total} entries</span>`;
  if (cur > 0)
    phtml += `<button class="btn-secondary" onclick="loadAudit(${(cur-1)*PAGE})">← Prev</button>`;
  phtml += `<span style="font-size:13px">Page ${cur+1} / ${pages}</span>`;
  if (cur < pages-1)
    phtml += `<button class="btn-secondary" onclick="loadAudit(${(cur+1)*PAGE})">Next →</button>`;
  document.getElementById('audit-pagination').innerHTML = phtml;
}

loadAudit(0);

function viewUserTimeline() {
  const u = document.getElementById('timelineUser').value.trim().toLowerCase();
  if (!u) { toast('Enter a username first.', 'error'); return; }
  window.location.href = `/audit/user/${encodeURIComponent(u)}`;
}
document.getElementById('timelineUser').addEventListener('keydown', e => {
  if (e.key === 'Enter') viewUserTimeline();
});
</script>
{% endblock %}
