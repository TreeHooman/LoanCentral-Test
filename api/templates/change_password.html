{% extends "base.html" %}
{% block title %}Change Password — LoanCentral{% endblock %}

{% block content %}
<div style="max-width:420px;margin:40px auto">
  <div class="section-header" style="margin-bottom:24px">
    <span class="section-title" style="font-size:20px">Change Password</span>
    <a class="btn-primary" style="background:var(--surface2);border:1px solid var(--border);color:var(--text2);text-decoration:none" href="{{ url_for('home') }}">← Back</a>
  </div>

  <div class="table-wrap" style="padding:28px">
    <form method="POST" action="/auth/change-password">
      <div style="margin-bottom:16px">
        <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px">Current Password</label>
        <input type="password" name="current_password" required
               style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;outline:none"
               placeholder="Your current password" />
      </div>
      <div style="margin-bottom:16px">
        <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px">New Password</label>
        <input type="password" name="new_password" required minlength="8"
               style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;outline:none"
               placeholder="Min. 8 characters" />
      </div>
      <div style="margin-bottom:24px">
        <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:0.4px">Confirm New Password</label>
        <input type="password" name="confirm_password" required minlength="8"
               style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;outline:none"
               placeholder="Repeat new password" />
      </div>
      <button type="submit" class="btn-primary" style="width:100%;padding:12px;font-size:15px">Update Password</button>
    </form>
  </div>
</div>
{% endblock %}
