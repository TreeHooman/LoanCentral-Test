<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Login - LoanCentral</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      background: #0f1117;
      color: #e2e6f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 18px;
    }
    .card {
      background: #1a1d26;
      border: 1px dashed #f1c40f;
      border-radius: 12px;
      padding: 28px;
      width: 390px;
      max-width: 100%;
    }
    h2 { color: #f1c40f; margin: 0 0 8px; }
    p { color: #8891aa; font-size: 13px; line-height: 1.45; margin: 0 0 18px; }
    label { font-size: 12px; color: #8891aa; display: block; margin-bottom: 4px; }
    input {
      width: 100%;
      background: #0f1117;
      border: 1px solid #2e3248;
      color: #e2e6f0;
      padding: 11px 12px;
      border-radius: 6px;
      font-size: 16px;
      margin-bottom: 12px;
      outline: none;
    }
    input:focus { border-color: #5b6ef5; }
    button {
      width: 100%;
      min-height: 42px;
      padding: 10px;
      background: #5b6ef5;
      border: none;
      color: #fff;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #7b8cff; }
    .quick-grid { display: grid; gap: 8px; margin-top: 14px; }
    .quick-grid button {
      background: #22263a;
      border: 1px solid #2e3248;
      color: #e2e6f0;
      text-align: left;
      padding: 10px 12px;
    }
    .quick-grid button:hover { border-color: #5b6ef5; }
    .quick-grid span {
      display: block;
      color: #8891aa;
      font-size: 11px;
      font-weight: 500;
      margin-top: 2px;
      line-height: 1.35;
    }
    .back {
      display: block;
      text-align: center;
      margin-top: 12px;
      color: #8891aa;
      font-size: 13px;
      text-decoration: none;
    }
    .back:hover { color: #e2e6f0; }
    .warning {
      background: rgba(241,196,15,0.1);
      border: 1px solid rgba(241,196,15,0.3);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 12px;
      color: #f1c40f;
      margin-bottom: 16px;
      line-height: 1.35;
    }
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 16px 0 12px;
      color: #8891aa;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .divider::before, .divider::after {
      content: "";
      height: 1px;
      background: #2e3248;
      flex: 1;
    }
  </style>
</head>
<body>
<div class="card">
  <h2>Dev Login</h2>
  <p>Bypass Reddit OAuth for local testing only. Disabled in production.</p>
  <div class="warning">This page only exists in dev/test environments.</div>
  <form method="POST">
    <label>Reddit Username</label>
    <input type="text" name="username" placeholder="e.g. testmod" autofocus required />
    <button type="submit">Login as this user</button>
    <div class="divider">Quick demo</div>
    <div class="quick-grid">
      <button type="submit" name="username" value="testlender" formnovalidate>testlender<span>Lender dashboard with active, repaid, and unpaid loans</span></button>
      <button type="submit" name="username" value="remote_weather186" formnovalidate>remote_weather186<span>Borrower dashboard with outstanding loan history</span></button>
      <button type="submit" name="username" value="testadmin" formnovalidate>testadmin<span>Owner/admin view with financial totals</span></button>
      <button type="submit" name="username" value="testmod" formnovalidate>testmod<span>Moderator access for later testing</span></button>
    </div>
  </form>
  <form method="POST">
    <input type="hidden" name="username" value="logistix1" />
    <input type="hidden" name="force_role" value="lender" />
    <div class="quick-grid" style="margin-top:0">
      <button type="submit">logistix1<span>Real lender — 20+ loans across r/LoanCentral (force role: lender)</span></button>
    </div>
  </form>
  <a class="back" href="/login">Back to login</a>
</div>
</body>
</html>
