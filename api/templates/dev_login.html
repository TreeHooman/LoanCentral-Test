<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Login — LoanCentral</title>
  <style>
    body { background: #0f1117; color: #e2e6f0; font-family: sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    .card { background: #1a1d26; border: 1px dashed #f1c40f; border-radius: 12px; padding: 32px; width: 360px; }
    h2 { color: #f1c40f; margin-bottom: 8px; }
    p { color: #8891aa; font-size: 13px; margin-bottom: 20px; }
    label { font-size: 12px; color: #8891aa; display: block; margin-bottom: 4px; }
    input { width: 100%; background: #0f1117; border: 1px solid #2e3248; color: #e2e6f0; padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 16px; outline: none; }
    button { width: 100%; padding: 10px; background: #5b6ef5; border: none; color: #fff; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #7b8cff; }
    .back { display: block; text-align: center; margin-top: 12px; color: #8891aa; font-size: 13px; text-decoration: none; }
    .back:hover { color: #e2e6f0; }
    .warning { background: rgba(241,196,15,0.1); border: 1px solid rgba(241,196,15,0.3); border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #f1c40f; margin-bottom: 16px; }
  </style>
</head>
<body>
<div class="card">
  <h2>⚠️ Dev Login</h2>
  <p>Bypass Reddit OAuth for local testing only. Disabled in production.</p>
  <div class="warning">This page only exists in dev/test environments.</div>
  <form method="POST">
    <label>Reddit Username</label>
    <input type="text" name="username" placeholder="e.g. testmod" autofocus required />
    <button type="submit">Login as this user</button>
  </form>
  <a class="back" href="/login">← Back to login</a>
</div>
</body>
</html>
