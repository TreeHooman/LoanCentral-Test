<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dev Login — LoanCentral</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e2e6f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .card { background: #1a1d26; border: 1px dashed #f1c40f40; border-radius: 16px; padding: 28px; width: 100%; max-width: 380px; }
    h2 { color: #f1c40f; margin-bottom: 6px; font-size: 18px; }
    .sub { color: #8891aa; font-size: 13px; margin-bottom: 20px; line-height: 1.5; }
    .warning { background: rgba(241,196,15,0.08); border: 1px solid rgba(241,196,15,0.2); border-radius: 6px; padding: 8px 12px; font-size: 12px; color: #f1c40f; margin-bottom: 20px; }
    label { font-size: 12px; color: #8891aa; display: block; margin-bottom: 4px; }
    input { width: 100%; background: #0f1117; border: 1px solid #2e3248; color: #e2e6f0; padding: 10px 12px; border-radius: 6px; font-size: 14px; margin-bottom: 14px; outline: none; }
    input:focus { border-color: #5b6ef5; }
    button { width: 100%; padding: 10px; background: #5b6ef5; border: none; color: #fff; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; margin-bottom: 14px; }
    button:hover { background: #7b8cff; }
    .quick-logins { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .quick-btn { padding: 8px 4px; background: #22263a; border: 1px solid #2e3248; color: #b0b8cc; border-radius: 6px; cursor: pointer; font-size: 12px; text-align: center; transition: all 0.15s; }
    .quick-btn:hover { border-color: #5b6ef5; color: #7b8cff; }
    .quick-btn .role { font-size: 10px; display: block; color: #8891aa; margin-top: 2px; }
    .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .divider hr { flex: 1; border: none; border-top: 1px solid #2e3248; }
    .divider span { font-size: 11px; color: #8891aa; }
    .back { display: block; text-align: center; color: #8891aa; font-size: 13px; text-decoration: none; }
    .back:hover { color: #e2e6f0; }
    .seed-link { display: block; text-align: center; color: #5b6ef5; font-size: 12px; text-decoration: none; margin-bottom: 12px; }
    .seed-link:hover { color: #7b8cff; }
  </style>
</head>
<body>
<div class="card">
  <h2>Dev Login</h2>
  <p class="sub">Local testing only. Bypasses Reddit OAuth.</p>
  <div class="warning">Only active when <code>LOANCENTRAL_ENV=dev</code></div>

  <p style="font-size:12px;color:#8891aa;margin-bottom:8px">Quick login:</p>
  <div class="quick-logins">
    <button class="quick-btn" type="button" onclick="quickLogin('testmod')">
      testmod<span class="role">mod</span>
    </button>
    <button class="quick-btn" type="button" onclick="quickLogin('testlender')">
      testlender<span class="role">lender</span>
    </button>
    <button class="quick-btn" type="button" onclick="quickLogin('testborrower')">
      testborrower<span class="role">borrower</span>
    </button>
  </div>

  <div class="divider"><hr><span>or enter any username</span><hr></div>

  <form method="POST" id="loginForm">
    <label>Reddit Username</label>
    <input type="text" name="username" id="usernameInput" placeholder="e.g. testlender2" autofocus required />
    <button type="submit">Login</button>
  </form>

  <a class="seed-link" href="/auth/dev-seed">Seed test data →</a>
  <a class="back" href="/login">← Back</a>
</div>
<script>
  function quickLogin(u) {
    document.getElementById('usernameInput').value = u;
    document.getElementById('loginForm').submit();
  }
</script>
</body>
</html>
