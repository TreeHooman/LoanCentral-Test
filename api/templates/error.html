<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — LoanCentral</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0f1117; color: #e2e6f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: #1a1d26; border: 1px solid #2e3248; border-radius: 16px; padding: 40px 32px; max-width: 440px; text-align: center; }
    .code { font-size: 64px; font-weight: 800; color: #5b6ef5; line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    p { color: #8891aa; font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    a { display: inline-block; padding: 10px 20px; background: rgba(91,110,245,0.15); border: 1px solid rgba(91,110,245,0.3); border-radius: 8px; color: #7b8cff; text-decoration: none; font-size: 13px; font-weight: 600; }
    a:hover { background: rgba(91,110,245,0.25); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">{{ code }}</div>
    <h1>{{ "Page Not Found" if code == 404 else "Access Denied" if code == 403 else "Server Error" }}</h1>
    <p>{{ message }}</p>
    <a href="/">← Back to Dashboard</a>
  </div>
</body>
</html>
