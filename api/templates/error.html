<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — LoanCentral</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0f1117; --surface: #1a1d26; --border: #2e3248; --accent: #5b6ef5; --accent-h: #7b8cff; --muted: #8891aa; --text: #e2e6f0; --text2: #b0b8cc; --red: #e74c3c; }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .container { max-width: 400px; }
    .code { font-size: 80px; font-weight: 800; color: var(--border); line-height: 1; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
    p { color: var(--text2); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    a { display: inline-block; background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 14px; transition: opacity 0.15s; }
    a:hover { opacity: 0.9; }
  </style>
</head>
<body>
<div class="container">
  <div class="code">{{ code }}</div>
  <h1>{{ 'Page Not Found' if code == 404 else 'Access Denied' if code == 403 else 'Server Error' }}</h1>
  <p>{{ message }}</p>
  <a href="/">Back to Dashboard</a>
</div>
</body>
</html>
