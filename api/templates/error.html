<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ code }} — LoanCentral</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px; max-width: 440px; text-align: center; }
    .code { font-size: 64px; font-weight: 800; color: var(--accent); line-height: 1; margin-bottom: 12px; }
    h1 { font-size: 18px; font-weight: 700; margin-bottom: 10px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
    a { display: inline-block; padding: 10px 20px; background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); border-radius: 8px; color: var(--accent-h); text-decoration: none; font-size: 13px; font-weight: 600; }
    a:hover { background: rgba(34,197,94,0.25); }
  </style>
</head>
<body>
  <div class="card">
    <div class="code">{{ code }}</div>
    <h1>{{ "Page Not Found" if code == 404 else "Access Denied" if code == 403 else "Server Error" }}</h1>
    <p>{{ message }}</p>
    <a href="/dashboard">← Back to Dashboard</a>
  </div>
</body>
</html>
