<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Link Expired — LoanCentral</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/brand.css') }}" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 24px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 40px 32px; max-width: 420px; }
    h1 { font-size: 22px; font-weight: 800; color: #e74c3c; margin-bottom: 12px; }
    p  { color: var(--muted); font-size: 14px; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Link expired or invalid</h1>
    <p>This dashboard link has expired, already been replaced, or is not valid.<br><br>
    Ask your lender or a mod to send you a new link.</p>
  </div>
</body>
</html>
