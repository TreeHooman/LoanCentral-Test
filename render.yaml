services:
  - type: web
    name: loancentral-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: LOANCENTRAL_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: loancentral-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: API_KEY
        generateValue: true
      - key: DASHBOARD_URL
        value: https://loancentral-web.onrender.com
      - key: DASHBOARD_CLIENT_ID
        sync: false
      - key: DASHBOARD_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_REDIRECT_URI
        value: https://loancentral-web.onrender.com/auth/callback
      - key: SUBREDDITS
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USERNAME
        sync: false
      - key: REDDIT_PASSWORD
        sync: false
      - key: REDDIT_USER_AGENT
        value: LoanCentralBot/1.0
      - key: REMINDER_REDDIT_ENABLED
        value: "false"
      - key: AUTO_BAN_REDDIT_ENABLED
        value: "false"
      - key: REDDIT_FLAIR_SYNC_ENABLED
        value: "false"

databases:
  - name: loancentral-db
    plan: free
