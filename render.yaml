services:
  - type: web
    # Must match the live service's name in Render (renamed there from
    # loancentral-web). Render matches blueprint services by name, so a
    # mismatch makes a blueprint sync create a second service.
    name: loancentral-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: LOANCENTRAL_ENV
        value: prod
      # Neon Postgres (free tier, AWS us-west-2), direct / non-pooled string.
      # Set by hand in the Render dashboard. The old free Render database
      # expired in July 2026, which is why no database is declared below:
      # Render's free databases are deleted after 30 days.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false  # Set once manually in Render dashboard — never regenerate or all sessions die
      - key: API_KEY
        sync: false  # Set once manually
      - key: UPLOAD_DIR
        value: /tmp/loancentral-uploads
      # /tmp is wiped on every restart on the free plan, so uploads stay off
      # (the code's production default) until durable storage exists.
      - key: ATTACHMENTS_ENABLED
        value: "false"
      # The custom domain (added under Settings -> Custom Domains in Render).
      # loancentral-dashboard.onrender.com keeps working as a second address.
      - key: DASHBOARD_URL
        value: https://loancentral.net
      # Sign in with Google (Google Cloud Console -> OAuth client, "Web
      # application"; authorized redirect URI: https://loancentral.net/auth/google/callback)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_CLIENT_ID
        sync: false
      - key: DASHBOARD_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_REDIRECT_URI
        value: https://loancentral.net/auth/callback
      - key: SUBREDDITS
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USERNAME
        sync: false
      - key: REDDIT_PASSWORD
        sync: false
      - key: REDDIT_USER_AGENT
        value: LoanCentralBot/1.0
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: REMINDER_REDDIT_ENABLED
        value: "false"
      - key: AUTO_BAN_REDDIT_ENABLED
        value: "false"
      - key: REDDIT_FLAIR_SYNC_ENABLED
        value: "false"
