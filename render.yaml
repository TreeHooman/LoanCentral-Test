services:
  - type: web
    name: loancentral-web
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn api.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: LOANCENTRAL_ENV
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: loancentral-db
          property: connectionString
      - key: SECRET_KEY
        sync: false  # Set once manually in Render dashboard — never regenerate or all sessions die
      - key: API_KEY
        sync: false  # Set once manually
      - key: UPLOAD_DIR
        value: /tmp/loancentral-uploads
      - key: DASHBOARD_URL
        value: https://loancentral-web.onrender.com
      - key: DASHBOARD_CLIENT_ID
        sync: false
      - key: DASHBOARD_CLIENT_SECRET
        sync: false
      - key: DASHBOARD_REDIRECT_URI
        value: https://loancentral-web.onrender.com/auth/callback
      - key: SUBREDDITS
        sync: false
      - key: REDDIT_CLIENT_ID
        sync: false
      - key: REDDIT_CLIENT_SECRET
        sync: false
      - key: REDDIT_USERNAME
        sync: false
      - key: REDDIT_PASSWORD
        sync: false
      - key: REDDIT_USER_AGENT
        value: LoanCentralBot/1.0
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: REMINDER_REDDIT_ENABLED
        value: "false"
      - key: AUTO_BAN_REDDIT_ENABLED
        value: "false"
      - key: REDDIT_FLAIR_SYNC_ENABLED
        value: "false"

databases:
  - name: loancentral-db
    plan: free
